name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Install SDK
        run: yes n | mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk

      - name: Build module
        working-directory: myfirstmodule
        run: mvn -B clean install

      - name: Upload built .omod
        uses: actions/upload-artifact@v4
        with:
          name: omod
          path: target/*.omod

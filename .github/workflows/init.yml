name: Init OpenMRS module
on: workflow_dispatch

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install OpenMRS SDK
        run: mvn org.openmrs.maven.plugins:openmrs-sdk-maven-plugin:setup-sdk

      - name: Create module
        run: |
          mvn openmrs-sdk:create-project \
            -DgroupId=org.openmrs.module \
            -DartifactId=mymodule \
            -Dname="My Module" \
            -Ddescription="My first OpenMRS module"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate OpenMRS module scaffold"
          git push
